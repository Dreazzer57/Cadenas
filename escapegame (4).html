<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Game</title>
</head>
<body>
    <div id="content">
        <h1>Welcome to the Escape Game!</h1>
        <!-- Main game content goes here -->
    </div>
    <div id="admin-panel">
        <h2>Admin Panel</h2>
        <div id="admin-tabs">
            <button onclick="openAdmin('indices')">Indices</button>
            <button onclick="openAdmin('commentaires')">Commentaires</button>
            <!-- Other tabs can be added here -->
        </div>
        <div id="admin-content">
            <div id="indices-content">
                <h3>Indices</h3>
                <!-- Content for indices goes here -->
            </div>
            <div id="commentaires-content" style="display: none;">
                <h3>Commentaires</h3>
                <label for="p2-comments">P2 Comments:</label>
                <textarea id="p2-comments"></textarea>
                <label for="p3-comments">P3 Comments:</label>
                <textarea id="p3-comments"></textarea>
                <label for="p4-comments">P4 Comments:</label>
                <textarea id="p4-comments"></textarea>
                <label for="p5-comments">P5 Comments:</label>
                <textarea id="p5-comments"></textarea>
                <button onclick="saveAdmin()">Save Comments</button>
            </div>
        </div>
    </div>
    <script>
        let comments = { p2:'', p3:'', p4:'', p5:'' };

        function openAdmin(tab) {
            document.getElementById('indices-content').style.display = tab === 'indices' ? 'block' : 'none';
            document.getElementById('commentaires-content').style.display = tab === 'commentaires' ? 'block' : 'none';
            // Add logic to handle other tabs if needed
        }

        function saveAdmin() {
            comments.p2 = document.getElementById('p2-comments').value;
            comments.p3 = document.getElementById('p3-comments').value;
            comments.p4 = document.getElementById('p4-comments').value;
            comments.p5 = document.getElementById('p5-comments').value;
            alert('Comments saved!');
            // Logic to handle storing comments in backend, if applicable
        }

        function displayComments() {
            // Logic to display comments under main content
            let commentsSection = document.createElement('div');
            commentsSection.id = 'comments-display';
            commentsSection.innerHTML = `<h3>User Comments</h3><p>P2: ${comments.p2}</p><p>P3: ${comments.p3}</p><p>P4: ${comments.p4}</p><p>P5: ${comments.p5}</p>`;
            document.getElementById('content').appendChild(commentsSection);
            // Add additional styling to comments section as needed
        }

        displayComments(); // Invoke to display comments upon page load
    </script>
</body>
</html>
